[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rvc-cli-inference"
version = "0.1.0"
description = "CLI-only offline RVC voice conversion and vocal separation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = [
  "LICENSE",
  "MIT协议暨相关引用库协议",
  "rvc/separation/LICENSE.pymss",
  "rvc/separation/LICENSE.pymss-core",
]
authors = [{ name = "RVC Project Contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dynamic = ["dependencies"]

[project.scripts]
rvc = "rvc.cli:main"

[project.urls]
Repository = "https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["rvc*", "infer*", "tools*"]
exclude = ["tests*", "assets*"]
namespaces = true

[tool.setuptools.package-data]
"rvc.separation" = [
  "resources/*.yaml",
  "LICENSE.pymss",
  "LICENSE.pymss-core",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements-inference.txt"] }
