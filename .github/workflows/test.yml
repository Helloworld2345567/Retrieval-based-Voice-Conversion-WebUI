name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    name: Python 3.12 CPU (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-inference.txt
            requirements-dev.txt
            requirments_cpu_py312.txt

      - name: Install Linux media libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg libsndfile1

      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install CPU Torch
        run: >-
          python -m pip install
          torch==2.4.1+cpu torchaudio==2.4.1+cpu
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install shared inference and test dependencies
        run: >-
          python -m pip install
          "hyper-connections>=0.1.8,<0.4.3"
          -r requirements-inference.txt
          -r requirements-dev.txt
          build

      - name: Install project without changing hardware dependencies
        run: python -m pip install --no-deps -e .

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests
        run: python -B -m pytest -q

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel contents
        run: >-
          python -c "import glob, zipfile;
          wheels = glob.glob('dist/*.whl');
          assert len(wheels) == 1, wheels;
          names = set(zipfile.ZipFile(wheels[0]).namelist());
          required = {'rvc/separation/LICENSE.pymss', 'rvc/separation/LICENSE.pymss-core', 'rvc/separation/resources/model_bs_roformer_ep_368_sdr_12.9628.yaml', 'tools/cuda_graph.py'};
          assert required <= names, required - names;
          forbidden = [name for name in names if name.startswith(('tests/', 'assets/', '.codex/', '.zcode/')) or '__pycache__' in name or name.endswith(('.pyc', '.pyo'))];
          assert not forbidden, forbidden"

      - name: Install built wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheels = glob.glob('dist/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheels[0]])"

      - name: Smoke installed CLI and resources outside repository
        working-directory: ${{ runner.temp }}
        run: |
          rvc --help
          rvc separate list
          python -I -m infer.cli --help
          python -I -m tools.pymss.cli list
          python -I -c "import infer.audio, infer.module.models, infer.vc.pipeline, tools.cuda_graph, tools.pymss; from importlib.resources import files; root = files('rvc.separation'); assert root.joinpath('resources', 'model_bs_roformer_ep_368_sdr_12.9628.yaml').is_file(); assert root.joinpath('LICENSE.pymss').is_file(); assert root.joinpath('LICENSE.pymss-core').is_file()"
